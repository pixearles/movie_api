services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "7f3a9c2e-8b41-4d6f-a1c9-e05b7d3f42a1"
      MSSQL_MEMORY_LIMIT_MB: "1024"
    volumes:
      - moviesdb-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__MoviesDb: "Server=db;Database=MoviesDb;User Id=sa;Password=7f3a9c2e-8b41-4d6f-a1c9-e05b7d3f42a1;TrustServerCertificate=True;"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  moviesdb-data: